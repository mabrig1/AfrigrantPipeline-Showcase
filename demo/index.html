<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AfrigrantPipeline eligibility demo</title><style>body{font:16px system-ui;background:#11231e;color:#effaf5;max-width:720px;margin:40px auto;padding:20px}select,button{font:inherit;padding:10px;margin:6px}article{background:#203a30;border-radius:10px;padding:16px;margin:10px 0}</style><h1>AfrigrantPipeline — Opportunity screening</h1><p>All opportunities are fictional. This is an independent demonstration, not a scholarship service.</p><form id="f"><label>Level <select id="level"><option>masters</option><option>undergraduate</option><option>doctoral</option></select></label><label>Subject <select id="subject"><option>engineering</option><option>history</option><option>health</option></select></label><button>Screen opportunities</button></form><div id="results" aria-live="polite"></div><script>const data=[['Fictional A','masters','engineering'],['Fictional B',null,'engineering'],['Fictional C','doctoral','health'],['Fictional D','undergraduate','history']];document.querySelector('#f').onsubmit=e=>{e.preventDefault();const level=document.querySelector('#level').value,subject=document.querySelector('#subject').value,root=document.querySelector('#results');root.replaceChildren();for(const [name,l,s] of data){const mismatch=(l!==null&&l!==level)||(s!==null&&s!==subject),status=mismatch?'Criteria mismatch':l===null||s===null?'Needs review':'Potential match';const card=document.createElement('article');card.textContent=name+' — '+status+' | Level: '+(l??'unknown')+' | Subject: '+(s??'unknown');root.append(card)}};document.querySelector('#f').requestSubmit();</script><p>Always verify actual eligibility on official funder websites.</p></html>
